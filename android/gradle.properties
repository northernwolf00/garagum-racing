# Keep the JVM footprint under the 7 GB available on GitHub-hosted CI runners.
# 8G heap + 4G metaspace OOM-killed the runner (Gradle exit 143). 4G heap is
# plenty for Flutter release builds and works fine locally too.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Fix network connection drops & premature end of stream during Gradle dependency downloads
systemProp.http.keepAlive=false
systemProp.https.protocols=TLSv1.2,TLSv1.3
org.gradle.internal.http.connectionTimeout=120000
org.gradle.internal.http.socketTimeout=120000

