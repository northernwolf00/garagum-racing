name: garagum_racing
description: "A new Flutter project."


publish_to: 'none' 

version: 1.0.0+1




environment:
  sdk: ^3.10.7




dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8
  flame: ^1.35.1
  flame_forge2d: ^0.19.2+4
  flame_audio: ^2.11.5
  vector_math: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  
  
  flutter_lints: ^6.0.0



flutter:

  
  uses-material-design: true

  assets:
    - assets/images/vehicles/
    - assets/images/parallax/
    - assets/images/terrain/
    - assets/images/bridge/
    - assets/images/obstacles/
    - assets/images/ui/
    - assets/images/fx/
    - assets/audio/music/
    - assets/audio/sfx/

 

 
